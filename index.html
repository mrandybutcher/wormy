<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Phaser 3 Basic Template</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        color: #e6edf3;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      /* Full-viewport box for ScaleManager parent bounds (avoid 100vw scrollbar quirks on some browsers). */
      .wrap {
        position: fixed;
        inset: 0;
        margin: 0;
      }
      /* Plain box for ScaleManager — avoid flex on #game (flex + Phaser’s sized canvas caused cross-browser crop). */
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        display: block;
        overflow: hidden;
        box-sizing: border-box;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="game"></div>
    </div>

    <!-- Phaser 3 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="./main.js?v=energy-lives"></script>
  </body>
</html>
